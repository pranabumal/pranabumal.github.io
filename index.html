<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pranab Sarker — Full Stack Engineer</title>
<meta name="description" content="Pranab Sarker, Senior Full Stack Engineer in Finland. Interactive CV with case studies: AI tutoring, data spaces, digital twins and public-sector systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f9fc; --paper:#ffffff; --ink:#0f1b61; --muted:#47548a; --faint:#73bbc5; --line-soft:#d8e9f1;
  --line:#6000cb; --fill:#aadcec; --duo:#105d67; --accent:#6000cb; --accent-2:#105d67; --accent-soft:#eef7fb;
  --serif:Bitter,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --stripes:repeating-linear-gradient(-45deg,var(--fill) 0 3px,transparent 3px 9px);
  /* node colours by kind (soft fills, purple outline everywhere) */
  --k-source:#e4f3f9; --k-process:#efe6fb; --k-store:#e0f3ef; --k-ai:#fdf1d8; --k-ui:#fbe7f0; --k-ext:#f1f4f7;
  --todo-bg:#fff3b0; --todo-ink:#5c4500; --verify:#d39a00;
  --ease:cubic-bezier(.165,.84,.44,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
/* white frame around the viewport */
html::before,html::after,body::before,body::after{content:"";position:fixed;background:#fff;z-index:60;pointer-events:none}
html::before,html::after{top:0;bottom:0;width:14px}
html::before{left:0} html::after{right:0}
body::before,body::after{left:0;right:0;height:14px}
body::before{top:0} body::after{bottom:0}
@media (max-width:600px){html::before,html::after{width:8px}body::before,body::after{height:8px}}
a{color:inherit;font-weight:700;text-decoration:none;border-bottom:.14em solid var(--fill);transition:border-color .2s}
a:hover{border-color:var(--line)}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink)}

/* ---------- review markers ---------- */
.todo,.review-fab{display:none}
.review .todo{display:inline;background:var(--todo-bg);color:var(--todo-ink);padding:1px 6px;border-radius:4px;font:500 .84em/1.4 var(--sans)}
.review .verify{text-decoration:underline dotted var(--verify) 2px;text-underline-offset:3px}
.has-review .review-fab{display:flex;position:fixed;right:26px;bottom:26px;z-index:70;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--fill);padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.review-fab b{width:10px;height:10px;border-radius:50%;background:#d0d5df}
.review .review-fab b{background:#f2c200}

/* ---------- layout ---------- */
#app{min-height:100vh;padding:48px 24px 90px}
.view{animation:enter .7s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.paper{position:relative;max-width:880px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);box-shadow:16px 16px 0 var(--fill);padding:60px 64px}
@media (max-width:700px){.paper{padding:30px 22px;box-shadow:8px 8px 0 var(--fill)}#app{padding:26px 14px 80px}}

/* ---------- view transitions ---------- */
::view-transition-old(root){animation:vt-out .32s var(--ease) both}
::view-transition-new(root){animation:vt-in .5s var(--ease) both}
html[data-nav="back"]::view-transition-old(root){animation:vt-out-back .32s var(--ease) both}
html[data-nav="back"]::view-transition-new(root){animation:vt-in-back .5s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateX(-40px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(60px)}}
@keyframes vt-out-back{to{opacity:0;transform:translateX(40px)}}
@keyframes vt-in-back{from{opacity:0;transform:translateX(-60px)}}
::view-transition-group(*){animation-duration:.5s;animation-timing-function:var(--ease)}

/* ---------- CV header with animated portrait ---------- */
.cv-head{display:grid;grid-template-columns:1fr 230px;gap:28px;align-items:center;padding-bottom:30px;border-bottom:2px solid var(--ink)}
.cv-head h1{margin:0;font-size:clamp(36px,6vw,54px);line-height:1.05;letter-spacing:-.01em}
.cv-head h1 .dot,.dot{color:var(--faint)}
.cv-head .role{font-family:var(--serif);font-size:19px;color:var(--duo);margin:8px 0 14px;font-weight:700}
.contacts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px;color:var(--muted)}
.contacts a{font-weight:600}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
@media (max-width:700px){.cv-head{grid-template-columns:1fr}.portrait{order:-1;width:190px;margin:0 auto}}

.portrait{position:relative;width:230px;aspect-ratio:1;--mx:0;--my:0}
.portrait .p-stripes{position:absolute;inset:6% -6% -6% 6%;border-radius:50%;background:var(--stripes);animation:spin 40s linear infinite;transform:translate(calc(var(--mx)*-14px),calc(var(--my)*-14px))}
.portrait .p-ring{position:absolute;inset:-4%;border-radius:50%;border:2px dashed var(--line);opacity:.55;animation:spin 60s linear infinite reverse}
.portrait .p-photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:2px solid var(--ink);background:var(--fill);transform:translate(calc(var(--mx)*8px),calc(var(--my)*8px));transition:transform .6s var(--ease);animation:avatarIn 1.2s var(--ease) both}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:breathe 7s ease-in-out infinite}
.portrait .p-duo{filter:url(#duotone)}
.portrait .p-real{opacity:0;transition:opacity .8s var(--ease)}
.portrait:hover .p-real{opacity:1}
.portrait .p-spark{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--line);right:10%;top:6%;box-shadow:0 0 0 6px rgba(96,0,203,.12);animation:orbit 9s ease-in-out infinite}
.portrait .p-spark.s2{width:10px;height:10px;background:var(--duo);left:2%;right:auto;top:auto;bottom:16%;animation-delay:-4s}
@keyframes spin{to{rotate:360deg}}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes avatarIn{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(75% at 50% 50%)}}
@keyframes orbit{50%{transform:translate(-8px,10px)}}

/* ---------- buttons ---------- */
.pill-btn{display:inline-block;border:2px solid var(--ink);background:#fff;padding:8px 16px;font:700 14px/1.2 var(--sans);color:var(--ink);white-space:nowrap;box-shadow:4px 4px 0 var(--fill);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.pill-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--fill);border-color:var(--ink)}
.pill-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--fill)}
.pill-btn.primary{background:var(--ink);color:#fff}
.pill-btn.primary:hover{color:#fff}

/* ---------- CV sections ---------- */
.cv-sec{margin-top:40px}
.cv-sec>h2{font-size:26px;margin:0 0 14px;line-height:1.2}
.cv-sec>h2::after{content:".";color:var(--faint)}
.summary{margin:0;font-size:16.5px;color:#26336e}
.hint{font-size:14px;color:var(--muted);margin:-6px 0 14px}

.prow{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 18px 16px 22px;margin:0 -18px 6px -22px;cursor:pointer;border:2px solid transparent;transition:border-color .25s,box-shadow .3s var(--ease),transform .3s var(--ease),background .25s}
.prow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line);transform:scaleY(0);transform-origin:top;transition:transform .35s var(--ease)}
.prow:hover,.prow:focus-visible{border-color:var(--ink);box-shadow:8px 8px 0 var(--fill);transform:translate(-3px,-3px);outline:none;background:#fff}
.prow:hover::before,.prow:focus-visible::before{transform:scaleY(1)}
.prow .t{font-family:var(--serif);font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.25}
.prow .kicker{font:700 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.1em;padding:5px 8px;background:var(--accent-soft);color:var(--duo);border:1px solid var(--fill)}
.prow .when{font-size:13.5px;color:var(--muted);text-align:right;white-space:nowrap;padding-top:3px}
.prow .d{grid-column:1/-1;color:var(--muted);font-size:15px}
.prow .res{grid-column:1/-1;font-size:14.5px;font-weight:700;color:var(--duo)}
.prow .res::before{content:"↗ ";color:var(--line)}
.prow .go{position:absolute;right:18px;bottom:16px;font-size:13px;font-weight:700;color:var(--line);opacity:0;transform:translateX(-8px);transition:all .3s var(--ease)}
.prow:hover .go{opacity:1;transform:none}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(170,220,236,.55);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12.5px;padding:2px 9px;border:1px solid var(--line-soft);background:var(--bg);color:var(--muted)}

.job{display:grid;grid-template-columns:150px 1fr;gap:4px 20px;padding:10px 0}
.job .when{color:var(--muted);font-size:14px;padding-top:2px}
.job .what b{display:block;font-family:var(--serif);font-size:16.5px}
.job .what span{color:var(--muted);font-size:14.5px}
.job .what ul{margin:6px 0 0;padding-left:18px;font-size:14.5px;color:#26336e}
@media (max-width:600px){.job{grid-template-columns:1fr}}
.mini-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mini-links a{font-size:13px;padding:3px 10px;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--fill);transition:transform .2s,box-shadow .2s}
.mini-links a:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--fill)}
.mini-links span{font-size:13px;font-weight:600;padding:3px 10px;border:1.5px solid var(--line-soft);background:var(--bg);color:var(--muted)}

.earlier{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.earlier div{border:1.5px solid var(--line-soft);padding:12px 14px;font-size:14px;background:var(--bg);transition:border-color .2s,box-shadow .3s var(--ease)}
.earlier div:hover{border-color:var(--ink);box-shadow:5px 5px 0 var(--fill)}
.earlier b{display:block;font-family:var(--serif);font-size:15.5px}
.earlier span{color:var(--faint);font-size:12.5px;font-weight:600}
.earlier p{margin:4px 0 0;color:var(--muted)}

.skills{display:grid;grid-template-columns:140px 1fr;gap:8px 20px;font-size:15px}
.skills dt{font-family:var(--serif);font-weight:700}
.skills dd{margin:0;color:#26336e}
@media (max-width:600px){.skills{grid-template-columns:1fr}.skills dd{margin-bottom:6px}}

/* ---------- detail page ---------- */
.topbar{max-width:1040px;margin:0 auto 22px;display:flex;align-items:center;gap:14px}
.back{white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);padding:8px 16px;font-size:14px;color:var(--ink);box-shadow:4px 4px 0 var(--fill);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.back:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--fill);border-color:var(--ink)}
.crumb{font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{max-width:1040px;margin:0 auto}
.hero{position:relative;overflow:hidden;background:#fff;border:2px solid var(--ink);box-shadow:14px 14px 0 var(--fill);padding:48px 48px 38px}
.hero .blob{position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:var(--stripes);opacity:.8;animation:spin 50s linear infinite}
.hero .blob.b2{right:40px;top:40px;width:120px;height:120px;background:none;border:2px solid var(--line);opacity:.5;animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translate(-12px,14px)}}
.hero .kicker{position:relative;display:inline-block;font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--duo);background:var(--accent-soft);border:1px solid var(--fill);padding:6px 10px}
.hero h1{position:relative;font-size:clamp(28px,4.4vw,44px);line-height:1.12;margin:16px 0 14px;max-width:820px}
.hero h1::after{content:".";color:var(--faint)}
.hero .lead{position:relative;font-size:17.5px;color:var(--muted);max-width:780px;margin:0}
.facts{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px;margin-top:28px}
.fact{background:var(--bg);border:1.5px solid var(--line-soft);padding:10px 14px}
.fact small{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700}
.fact span{font-weight:700;font-size:14.5px}
.hero .links{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
@media (max-width:700px){.hero{padding:30px 20px;box-shadow:8px 8px 0 var(--fill)}.hero .blob{width:150px;height:150px;right:-60px;top:-60px;opacity:.5}.hero .blob.b2{display:none}}

.block{background:#fff;border:2px solid var(--ink);padding:34px 40px;margin-top:28px}
.block h2{font-size:24px;margin:0 0 4px}
.block h2::after{content:".";color:var(--faint)}
.block .sub{color:var(--muted);margin:0 0 22px;font-size:15px}
@media (max-width:700px){.block{padding:24px 18px}}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.two .block{margin-top:0}
.prose p{margin:0 0 12px;font-size:16px}

/* ---------- animated flow diagram ---------- */
.diagram{display:flex;flex-direction:column;gap:20px}
.lane{position:relative;border:1.5px dashed #b8cfe0;padding:16px 16px 18px;background:var(--bg)}
.lane-label{font:700 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--duo);margin-bottom:14px}
.lane-row{display:flex;align-items:stretch}
.node{flex:1 1 0;min-width:0;padding:11px 10px;text-align:center;background:var(--nb,#fff);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--fill);transition:transform .4s var(--ease),box-shadow .4s var(--ease),opacity .4s,filter .4s;position:relative}
.node b{display:block;font-family:var(--serif);font-size:14px;line-height:1.25}
.node small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.node.k-source{--nb:var(--k-source)} .node.k-process{--nb:var(--k-process)} .node.k-store{--nb:var(--k-store)}
.node.k-ai{--nb:var(--k-ai)} .node.k-ui{--nb:var(--k-ui)} .node.k-ext{--nb:var(--k-ext)}
.diagram.focus .node{opacity:.32;filter:grayscale(.6)}
.diagram.focus .node.hl{opacity:1;filter:none;transform:translate(-3px,-5px);box-shadow:8px 9px 0 var(--line);z-index:2}
.conn{flex:0 0 34px;position:relative;align-self:center;height:20px}
.conn::before{content:"";position:absolute;left:6px;right:8px;top:50%;border-top:2px dashed var(--line);opacity:.45;transform:translateY(-50%)}
.conn::after{content:"";position:absolute;right:3px;top:50%;width:7px;height:7px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:translateY(-50%) rotate(45deg);opacity:.7}
.conn i{position:absolute;top:50%;left:4px;width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:-4px;box-shadow:0 0 0 4px rgba(96,0,203,.15);animation:flowx 1.6s var(--ease) infinite;animation-delay:var(--d,0s)}
@keyframes flowx{0%{left:2px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 12px);opacity:0}}
@keyframes flowy{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 12px);opacity:0}}
@media (max-width:720px){
  .lane-row{flex-direction:column}
  .conn{flex:0 0 28px;width:20px;height:28px;align-self:center}
  .conn::before{left:50%;right:auto;top:2px;bottom:8px;border-top:0;border-left:2px dashed var(--line);transform:translateX(-50%)}
  .conn::after{left:50%;right:auto;top:auto;bottom:3px;transform:translateX(-50%) rotate(135deg)}
  .conn i{left:50%;margin-left:-4px;margin-top:0;animation-name:flowy}
}
.gap{flex:0 0 16px;height:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border:1.5px solid var(--ink)}

/* walkthrough */
.walk{display:grid;grid-template-columns:300px 1fr;gap:22px;margin-top:26px}
@media (max-width:860px){.walk{grid-template-columns:1fr}}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.step{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line-soft);background:#fff;padding:9px 12px;font-size:14.5px;color:var(--ink);transition:all .3s var(--ease)}
.step:hover{border-color:var(--ink)}
.step .n{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--sans);border:1.5px solid var(--ink);color:var(--ink);transition:all .3s}
.step.on{border-color:var(--ink);box-shadow:5px 5px 0 var(--fill);transform:translate(-2px,-2px);font-weight:700}
.step.on .n{background:var(--line);border-color:var(--line);color:#fff}
.step-panel{position:relative;overflow:hidden;border:2px solid var(--ink);background:#fff;box-shadow:8px 8px 0 var(--fill);padding:22px 24px;min-height:160px}
.step-panel::after{content:"";position:absolute;right:-40px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:var(--stripes);opacity:.6}
.step-panel h3{position:relative;margin:0 0 8px;font-size:19px}
.step-panel p{position:relative;margin:0;color:#26336e}
.step-panel .fade{animation:enter .45s var(--ease) both}
.play{display:inline-flex;align-items:center;gap:8px;margin-top:14px}
.progress{height:4px;background:var(--line-soft);margin-top:18px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--line)}
.progress i.run{animation:prog var(--t,4s) linear forwards}
@keyframes prog{to{width:100%}}

/* contributions + decisions */
.contrib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.contrib li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.contrib li>span.c{flex:1}
.contrib li::before{content:"";flex:0 0 12px;height:12px;margin-top:6px;border-radius:50%;background:var(--fill);border:2px solid var(--line)}
.contrib li.team::before{background:#fff;border-color:var(--faint)}
.contrib li.team{color:var(--muted)}
.decisions{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:16px}
.dec{border:2px solid var(--ink);padding:18px 20px;background:#fff;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease);position:relative}
.dec:hover,.dec.open{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--fill)}
.dec h3{font-size:16.5px;margin:0;padding-right:26px;line-height:1.3}
.dec .why{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.dec .why>div{overflow:hidden;font-size:14.5px;color:#26336e}
.dec.open .why{grid-template-rows:1fr}
.dec.open .why>div{padding-top:10px}
.dec .plus{position:absolute;right:14px;top:14px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px;transition:transform .35s var(--ease),background .3s}
.dec.open .plus{transform:rotate(45deg);background:var(--fill)}
.dec .lbl{font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--line);margin-bottom:8px;display:block}

/* results */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:14px;margin-bottom:22px}
.metric{padding:14px 16px;background:var(--bg);border:1.5px solid var(--line-soft);position:relative;overflow:hidden}
.metric::after{content:"";position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:var(--stripes)}
.metric b{position:relative;display:block;font:700 28px/1.15 var(--serif);color:var(--ink)}
.metric span{position:relative;font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13.5px;padding:4px 11px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.chip:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--fill)}

/* placement widget */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const byId = id => PROJECTS.find(p => p.id === id);
const fmt = n => n.toLocaleString("en-US");
const plain = s => s.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&");
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function Diagram(d) {
  let delay = 0;
  const lanes = d.lanes.map(l => {
    const parts = [];
    l.nodes.forEach((n, i) => {
      if (i && l.noflow) parts.push(`<span class="gap"></span>`);
      else if (i) parts.push(`<span class="conn" aria-hidden="true"><i style="--d:${((delay += .27) % 1.6).toFixed(2)}s"></i></span>`);
      parts.push(`<div class="node k-${n[3]}" data-node="${n[0]}"><b>${n[1]}</b><small>${n[2]}</small></div>`);
    });
    return `<div class="lane"><div class="lane-label">${l.label}</div><div class="lane-row">${parts.join("")}</div></div>`;
  }).join("");
  const kinds = [["source","Source"],["process","Service"],["store","Storage"],["ai","AI / core logic"],["ui","User-facing"],["ext","External"]];
  const legend = kinds.map(k => `<span><i style="background:var(--k-${k[0]});border-color:var(--k-${k[0]}-b)"></i>${k[1]}</span>`).join("");
  return `<div class="diagram">${lanes}</div><div class="legend">${legend}</div>`;
}

function Walkthrough(p) {
  const steps = p.steps.map((s, i) => `<li><button class="step" type="button" data-i="${i}"><span class="n">${i + 1}</span><span>${plain(s[0])}</span></button></li>`).join("");
  return `<div class="walk">
    <div><ol class="steps">${steps}</ol>
      <button class="pill-btn primary play" type="button" data-play>▶ Play walkthrough</button></div>
    <div><div class="step-panel"><div class="fade"><h3>Click a step, or press play</h3><p>Each step highlights the parts of the diagram involved, so you can follow the data through the system.</p></div></div>
      <div class="progress"><i></i></div></div>
  </div>`;
}

function Placement() {
  return `<section class="block reveal">
    <h2>Try the three placements</h2>
    <p class="sub">Only the provider's Control Plane (CP) and Data Plane (DP) move. Pick a placement and watch where they go.</p>
    <div class="tabs" role="tablist">
      <button type="button" data-arch="edge">Edge</button>
      <button type="button" data-arch="hybrid" class="on">Hybrid</button>
      <button type="button" data-arch="cloud">Cloud</button>
    </div>
    <div class="zones">
      <div class="zone edge"><h4>Factory edge</h4><small>edge server + the machine's data source</small><div class="slot" data-zone="edge"></div></div>
      <div class="zone cloud"><h4>Provider cloud</h4><small>CSC cPouta</small><div class="slot" data-zone="cloud"></div></div>
      <div class="zone partner"><h4>External partner</h4><small>a separate hosting provider</small><div class="slot" data-zone="partner"></div></div>
    </div>
    <p class="pcap" data-cap></p>
  </section>`;
}
const ARCH = {
  edge:   { cp: "edge",  dp: "edge",  cap: "<b>Edge:</b> everything stays at the factory. Data only leaves the site to reach the partner, but the factory has to operate the whole connector." },
  hybrid: { cp: "cloud", dp: "edge",  cap: "<b>Hybrid:</b> contracts and policies are managed in the cloud, while the data moves straight from the edge. In the measurements it kept Edge's stable tail latency." },
  cloud:  { cp: "cloud", dp: "cloud", cap: "<b>Cloud:</b> easiest to operate, but every byte crosses the factory-to-cloud link. Its median was fine, but it had the rare long stalls (up to 4 s at p95, 15 s worst case)." }
};
function setArch(a, animate) {
  const apply = () => {
    $$(".slot").forEach(s => s.innerHTML = "");
    $('[data-zone="edge"]').insertAdjacentHTML("beforeend", `<span class="zchip fixed">Data source (crane + AAS)</span>`);
    $('[data-zone="partner"]').insertAdjacentHTML("beforeend", `<span class="zchip fixed">Consumer CP + DP</span>`);
    $(`[data-zone="${ARCH[a].cp}"]`).insertAdjacentHTML("beforeend", `<span class="zchip cp" style="view-transition-name:chip-cp">Provider CP</span>`);
    $(`[data-zone="${ARCH[a].dp}"]`).insertAdjacentHTML("beforeend", `<span class="zchip dp" style="view-transition-name:chip-dp">Provider DP</span>`);
    $("[data-cap]").innerHTML = ARCH[a].cap;
    $$("[data-arch]").forEach(b => b.classList.toggle("on", b.dataset.arch === a));
  };
  if (animate && document.startViewTransition && !reduced()) document.startViewTransition(apply);
  else apply();
}

function Metrics(list) {
  if (!list.length) return "";
  return `<div class="metrics">${list.map(([num, text, suffix, label]) => {
    const val = num == null ? text : `<span data-count="${num}" data-suffix="${suffix}">0${suffix}</span>`;
    return `<div class="metric"><b>${val}</b><span>${label}</span></div>`;
  }).join("")}</div>`;
}

    <div class="prow" tabindex="0" role="link" data-go="${p.id}" aria-label="Open case study: ${plain(p.short)}">
      <div class="t"><span style="view-transition-name:t-${p.id}">${p.short}</span><span class="kicker">${p.kicker}</span></div>
      <div class="when">${p.period}</div>
      <div class="d">${p.cvLine}</div>
      <div class="res">${p.result}</div>
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <span class="go">Open case study →</span>
    </div>`).join("");
  const jobs = EXPERIENCE.map(j => `
    <div class="job"><div class="when">${j[0]}</div>
      <div class="what"><b>${j[1]}</b><span>${j[2]}</span>
        <ul>${j[3].map(x => `<li>${x}</li>`).join("")}</ul>
        ${(j[4].length || j[5].length) ? `<div class="mini-links">${j[4].map(id => `<a href="#/p/${id}">${byId(id).short} →</a>`).join("")}${j[5].map(n => `<span>${n}</span>`).join("")}</div>` : ""}
      </div></div>`).join("");
  return `<article class="paper view">
    <header class="cv-head">
      <div>
        <h1>${P.name}<span class="dot">.</span></h1>
        <div class="role">${P.role}</div>
        <div class="contacts">
          <span>${P.location}</span>
          <a href="mailto:${P.email}">${P.email}</a>
          <a href="${P.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
          <a href="${P.github}" target="_blank" rel="noopener">GitHub</a>
        </div>
        <div class="head-actions">
          <a class="pill-btn primary" href="mailto:${P.email}">Contact me</a>
          <button class="pill-btn no-print" type="button" onclick="window.print()">Print / save as PDF</button>
        </div>
      </div>
      <div class="portrait" aria-hidden="false">
        <span class="p-stripes"></span>
        <span class="p-ring"></span>
        <div class="p-photo">
          <img class="p-duo" src="${P.photo}" alt="Portrait of ${P.name}" width="700" height="700">
          <img class="p-real" src="${P.photo}" alt="" width="700" height="700">
        </div>
        <span class="p-spark"></span><span class="p-spark s2"></span>
      </div>
    </header>

    <section class="cv-sec"><h2>Profile</h2><p class="summary">${P.summary}</p></section>

    <section class="cv-sec"><h2>Highlighted projects</h2>
      ${projects}
    </section>

    <section class="cv-sec"><h2>Experience</h2>${jobs}</section>

    <section class="cv-sec"><h2>More work</h2>
      <div class="earlier">${EARLIER.map(e => `<div><b>${e[0]}</b><span>${e[1]}</span><p>${e[2]}</p></div>`).join("")}</div>
    </section>

    <section class="cv-sec"><h2>Skills</h2>
      <dl class="skills">${SKILLS.map(s => `<dt>${s[0]}</dt><dd>${s[1]}</dd>`).join("")}</dl>
    </section>

    <section class="cv-sec"><h2>Education</h2>
      ${EDUCATION.map(e => `<div class="job"><div class="when">${e[0]}</div><div class="what"><b>${e[1]}</b><span>${e[2]}</span></div></div>`).join("")}
    </section>
  </article>
  <footer class="foot">© 2026 ${P.name} · Finland</footer>`;
}

function ProjectView(p) {
  const i = PROJECTS.indexOf(p);
  const prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length];
  const next = PROJECTS[(i + 1) % PROJECTS.length];
  const links = p.links.map(l => `<a class="pill-btn primary" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("");
  const verdicts = p.verdicts ? `<section class="block reveal"><h2>Which factory data flows can go through a connector?</h2>
    <p class="sub">Verdicts per data-flow class, using pull transfers.</p>
    <div class="verdicts">${p.verdicts.map(v => `<div class="verdict ${v[0]}"><span class="tag2">${v[0] === "ok" ? "✓ Works" : "✕ Network-limited"}</span><h4>${v[1]}</h4><small style="color:var(--faint)">${v[2]}</small><p>${v[3]}</p></div>`).join("")}</div></section>` : "";
  return `<div class="view">
  <div class="topbar">
    <a class="back" href="#/">← Back to CV</a>
    <span class="crumb">Projects / ${p.short}</span>
  </div>
  <article class="detail">
    <header class="hero">
      <span class="blob"></span><span class="blob b2"></span>
      <span class="kicker">${p.kicker}</span>
      <h1 style="view-transition-name:t-${p.id}">${p.title}</h1>
      <p class="lead">${p.lead}</p>
      <div class="facts">
        <div class="fact"><small>Organisation</small><span>${p.org}</span></div>
        <div class="fact"><small>Period</small><span>${p.period}</span></div>
        ${p.facts.map(f => `<div class="fact"><small>${f[0]}</small><span>${f[1]}</span></div>`).join("")}
      </div>
      ${links ? `<div class="links">${links}</div>` : ""}
    </header>

    <section class="block reveal prose"><h2>The problem</h2><p class="sub">Why this system exists.</p>${p.problem.map(x => `<p>${x}</p>`).join("")}</section>

    <section class="block reveal"><h2>How it works</h2>
      <p class="sub">The moving dots show data flowing through the system. Use the walkthrough to light up each part.</p>
      ${Diagram(p.diagram)}
      ${Walkthrough(p)}
    </section>

    ${p.extra === "placement" ? Placement() : ""}

    <div class="two" style="margin-top:18px">
      <section class="block reveal"><h2>What I built</h2><p class="sub">My own contributions${p.team.length ? ", and credit where it's due" : ""}.</p>
        <ul class="contrib">${p.mine.map(x => `<li><span class="c">${x}</span></li>`).join("")}${p.team.map(x => `<li class="team"><span class="c">${x}</span></li>`).join("")}</ul>
      </section>
      <section class="block reveal"><h2>Results</h2><p class="sub">What happened in production.</p>
        ${Metrics(p.metrics)}
        <ul class="contrib">${p.outcomes.map(x => `<li><span class="c">${x}</span></li>`).join("")}</ul>
      </section>
    </div>

    ${verdicts}

    <section class="block reveal"><h2>Key technical decisions</h2><p class="sub">Click a card to see the reasoning.</p>
      <div class="decisions">${p.decisions.map(d => `<div class="dec" tabindex="0" role="button" aria-expanded="false"><span class="plus">+</span><span class="lbl">${d[0]}</span><h3>${d[1]}</h3><div class="why"><div>${d[2]}</div></div></div>`).join("")}</div>
    </section>

    <section class="block reveal"><h2>Tech stack</h2><div class="chips" style="margin-top:12px">${p.stack.map(s => `<span class="chip">${s}</span>`).join("")}</div></section>

    <nav class="pager">
      <a href="#/p/${prev.id}"><small>← Previous</small><b>${prev.short}</b></a>
      <a class="next" href="#/p/${next.id}"><small>Next →</small><b>${next.short}</b></a>
    </nav>
  </article>
  <footer class="foot"><a href="#/">← Back to CV</a></footer>
  </div>`;
}

/* =====================================================================
   Behaviour (runs after each render)
   ===================================================================== */
let playTimer = null;
function hydrate() {
  // reveal on scroll
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); countUp(e.target); }
  }), { threshold: .1 }) : null;
  $$(".reveal").forEach(el => io ? io.observe(el) : (el.classList.add("in"), countUp(el)));

  // project rows: ripple, then navigate
  $$(".prow").forEach(row => {
    const go = e => {
      if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      const r = row.getBoundingClientRect(), s = Math.max(r.width, r.height);
      const cx = e.clientX || r.left + r.width / 2, cy = e.clientY || r.top + r.height / 2;
      row.insertAdjacentHTML("beforeend", `<span class="ripple" style="width:${s}px;height:${s}px;left:${cx - r.left - s / 2}px;top:${cy - r.top - s / 2}px"></span>`);
      setTimeout(() => { location.hash = "#/p/" + row.dataset.go; }, 140);
    };
    row.addEventListener("click", go);
    row.addEventListener("keydown", go);
  });

  // portrait drifts gently with the mouse
  const portrait = $(".portrait");
  if (portrait && !reduced() && matchMedia("(pointer:fine)").matches) {
    onmousemove = e => {
      portrait.style.setProperty("--mx", ((e.clientX / innerWidth) - .5).toFixed(3));
      portrait.style.setProperty("--my", ((e.clientY / innerHeight) - .5).toFixed(3));
    };
  } else onmousemove = null;

  // decision cards
  $$(".dec").forEach(d => {
    const t = () => d.setAttribute("aria-expanded", d.classList.toggle("open"));
    d.addEventListener("click", t);
    d.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } });
  });

  // walkthrough
  const r = route();
  if (r.view !== "project") return;
  const p = byId(r.id);
  const diagram = $(".diagram"), panel = $(".step-panel"), bar = $(".progress i"), playBtn = $("[data-play]");
  let cur = -1;
  const show = i => {
    cur = i;
    const s = p.steps[i];
    $$(".step").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
    diagram.classList.add("focus");
    $$(".node", diagram).forEach(n => n.classList.toggle("hl", s[2].includes(n.dataset.node)));
    panel.innerHTML = `<div class="fade"><h3>${i + 1}. ${s[0]}</h3><p>${s[1]}</p></div>`;
  };
  const stop = () => { clearInterval(playTimer); playTimer = null; playBtn.textContent = "▶ Play walkthrough"; bar.classList.remove("run"); };
  $$(".step").forEach(b => b.addEventListener("click", () => { stop(); show(+b.dataset.i); }));
  playBtn.addEventListener("click", () => {
    if (playTimer) return stop();
    const tick = () => {
      show((cur + 1) % p.steps.length);
      bar.classList.remove("run"); void bar.offsetWidth; bar.style.setProperty("--t", "4.2s"); bar.classList.add("run");
    };
    tick(); playTimer = setInterval(tick, 4200);
    playBtn.textContent = "❚❚ Pause";
  });
  if ($("[data-arch]")) {
    $$("[data-arch]").forEach(b => b.addEventListener("click", () => setArch(b.dataset.arch, true)));
    setArch("hybrid", false);
  }
}

function countUp(scope) {
  $$("[data-count]", scope).forEach(el => {
    const end = +el.dataset.count, suf = el.dataset.suffix || "";
    if (reduced()) { el.textContent = fmt(end) + suf; return; }
    const t0 = performance.now(), dur = 1300;
    const f = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(end * e)) + suf; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

/* =====================================================================
   Router (hash based, so it works on GitHub Pages without config)
   ===================================================================== */
function route() {
  const m = location.hash.match(/^#\/p\/([\w-]+)/);
  return m && byId(m[1]) ? { view: "project", id: m[1] } : { view: "cv" };
}
let cvScroll = 0, last = route().view;
function render() {
  clearInterval(playTimer); playTimer = null;
  const r = route();
  $("#app").innerHTML = r.view === "cv" ? CVView() : ProjectView(byId(r.id));
  document.title = r.view === "cv" ? "Pranab Sarker — Full Stack Engineer" : plain(byId(r.id).short) + " — Pranab Sarker";
  hydrate();
}
function navigate() {
  const r = route();
  const back = r.view === "cv";
  if (!back && last === "cv") cvScroll = scrollY;
  document.documentElement.dataset.nav = back ? "back" : "forward";
  const done = () => { render(); scrollTo({ top: back ? cvScroll : 0, behavior: "instant" }); };
  if (document.startViewTransition && !reduced()) document.startViewTransition(done);
  else done();
  last = r.view;
}
addEventListener("hashchange", navigate);
addEventListener("keydown", e => { if (e.key === "Escape" && route().view === "project") location.hash = "#/"; });

/* review notes toggle */
if (REVIEW_MODE) {
  document.body.classList.add("has-review");
  let on = true;
  try { on = localStorage.getItem("review") !== "off"; } catch (e) {}
  document.body.classList.toggle("review", on);
  $("#reviewFab").addEventListener("click", () => {
    const v = document.body.classList.toggle("review");
    try { localStorage.setItem("review", v ? "on" : "off"); } catch (e) {}
  });
}

render();
</script>
</body>
